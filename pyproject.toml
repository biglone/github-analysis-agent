[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-analysis-agent"
version = "0.1.0"
description = "Small, testable GitHub repository reading tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "openai>=1.68,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
proxy = ["httpx[socks]>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
